# =============================================================================
# HYPRLOCK CONFIGURATION — MIDNIGHT THEME
# Location: ~/.config/hypr/hyprlock.conf
# =============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
}

# Clock (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 246, 252, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(139, 148, 158, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 80
    halign = center
    valign = center
}

# User Greeting & Battery Status
label {
    monitor =
    text = cmd[update:10000] echo "$USER @ $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '?')% Battery"
    color = rgba(88, 166, 255, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(88, 166, 255, 0.8)
    inner_color = rgba(22, 27, 34, 0.85)
    font_color = rgba(240, 246, 252, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##8b949e">Enter Password...</span>
    hide_input = false
    rounding = 12
    check_color = rgba(210, 153, 34, 0.9)
    fail_color = rgba(248, 81, 73, 0.9)
    fail_text = <i>Authentication Failed ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}

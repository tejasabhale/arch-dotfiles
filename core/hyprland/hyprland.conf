# =============================================================================
# CUSTOM ARCH LINUX DESKTOP ENVIRONMENT — HYPRLAND CONFIGURATION BRIDGE
# Legacy Fallback ONLY for Hyprland versions < 0.55.
# IMPORTANT: Hyprland 0.57+ has completely dropped legacy .conf support upstream.
# On Hyprland 0.55+ (and especially 0.57+), native Lua (hyprland.lua) is mandatory.
# Hardware Target: HP EliteBook 840 G5 (Intel UHD 620, 8GB RAM)
# =============================================================================

# 1. Environment Variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = LIBVA_DRIVER_NAME,iHD

# 2. Monitor Setup
monitor = eDP-1,1920x1080@60,0x0,1
monitor = ,preferred,auto,1

# 3. Input Configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
    sensitivity = 0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# 4. General & Layout
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgb(58a6ff)
    col.inactive_border = rgb(30363d)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# 5. Autostart Daemons
exec-once = quickshell
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = pipewire
exec-once = wireplumber
exec-once = wl-paste --watch cliphist store

# 6. Core Keybindings
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, Space, exec, quickshell -p shell/shell.qml --signal ipcBridge.assistantToggled
bind = $mainMod, D, exec, quickshell -p shell/shell.qml --signal ipcBridge.launcherToggled
bind = $mainMod, I, exec, quickshell -p shell/shell.qml --signal ipcBridge.controlCenterToggled
bind = $mainMod, N, exec, quickshell -p shell/shell.qml --signal ipcBridge.notificationsToggled
bind = $mainMod, F, fullscreen, 0

# Workspace Switch (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move Active Window to Workspace (1-5)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Hardware Keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

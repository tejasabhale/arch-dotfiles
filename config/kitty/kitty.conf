# =============================================================================
# KITTY TERMINAL CONFIGURATION — MIDNIGHT THEME
# Target: GPU Accelerated, High Contrast, JetBrainsMono Nerd Font
# =============================================================================

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

# Cursor Customization
cursor                #58a6ff
cursor_text_color     #0d1117
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback Buffer
scrollback_lines 10000

# Mouse
url_color       #58a6ff
url_style       curly
open_url_with   default
detect_urls     yes
copy_on_select  yes

# Performance & Rendering
repaint_delay   10
input_delay     3
sync_to_monitor yes

# Audio Bell (Disabled to prevent annoying hardware chimes)
enable_audio_bell    no
visual_bell_duration 0.0

# Window Layout & Padding
window_padding_width 10 12
confirm_os_window_close 0
background_opacity 0.94

# Color Palette (Midnight Preset: GitHub Dark / Indigo Accents)
foreground            #f0f6fc
background            #0d1117
selection_foreground  #0d1117
selection_background  #58a6ff

# Normal Colors
color0  #161b22
color1  #f85149
color2  #3fb950
color3  #d29922
color4  #58a6ff
color5  #bc8cff
color6  #39c5cf
color7  #b1bac4

# Bright Colors
color8  #484f58
color9  #ff7b72
color10 #56d364
color11 #e3b341
color12 #79c0ff
color13 #d2a8ff
color14 #56d4dd
color15 #f0f6fc

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
